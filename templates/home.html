{% extends "base.html" %}
{% block content %}
<div class="landing-page">
    <section class="hero">
        <h1>Welcome to StudyBuddy</h1>
        <p>Create an account, log in, and save your enrolled courses to your profile.</p>

        {% if current_user %}
            <div class="hero-cta">
                <a class="button" href="{{ url_for('auth.profile') }}">Go to Profile</a>
            </div>
        {% else %}
            <div class="hero-cta">
                <a class="button" href="{{ url_for('auth.signup') }}">Get Started</a>
                <span class="hero-or">or</span>
                <a class="button button-secondary" href="{{ url_for('auth.login') }}">Log in</a>
            </div>
        {% endif %}
    </section>
</div>
{% endblock %}
